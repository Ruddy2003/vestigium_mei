name: Comparación de temas (rama de análisis)

# Saca las capturas que pide `.github/comparacion.env` para comparar los temas actuales con los nuevos, sin tocar las ramas
# compartidas `ci-log`, `capturas` ni `temas-nuevos-ci`. Publica en la rama `comparacion-ci`. No publica ninguna versión.
# Es temporal: se borra, con su rama, al terminar el análisis.
on:
  push:
    branches: [ccr-ca31af2d-ua0p3j]
    # Solo corre cuando cambia la app o lo que se pide capturar: los documentos y el arnés no la reinician.
    paths: ['app/**', 'gradle/**', '*.kts', '.github/comparacion.env']

permissions:
  contents: write

concurrency:
  group: comparacion
  cancel-in-progress: true

jobs:
  comparacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y sacar capturas
        run: |
          chmod +x gradlew
          set -a; . .github/comparacion.env; set +a
          (while true; do echo "MEMORIA $(free -m | awk '/Mem:/ {print $3 " MB usados, " $7 " MB disponibles"}')"; sleep 20; done) &
          ./gradlew :app:compileDebugUnitTestKotlin --no-daemon 2>&1 | tee compilar.log || true
          pkill -f KotlinCompileDaemon || true
          ./gradlew :app:recordPaparazziDebug --no-daemon 2>&1 | tee capturas.log || true
      - name: Publicar en la rama comparacion-ci
        if: always()
        run: |
          mkdir -p /tmp/cap && cd /tmp/cap
          cp "$GITHUB_WORKSPACE"/app/src/test/snapshots/images/*.png . 2>/dev/null || true
          for f in "$GITHUB_WORKSPACE"/app/build/test-results/testDebugUnitTest/*.xml; do grep -A 25 "<failure" "$f" | head -60; done > fallas.txt 2>/dev/null || true
          grep -E "^e: |FAILED|Exception|error:|What went wrong" "$GITHUB_WORKSPACE/compilar.log" | head -300 > errores_compilar.txt || true
          grep -E "^e: |FAILED|Exception|error:|What went wrong" "$GITHUB_WORKSPACE/capturas.log" | head -150 > errores.txt || true
          tail -80 "$GITHUB_WORKSPACE/capturas.log" > final.txt
          echo "${{ github.sha }} run ${{ github.run_number }} ${{ github.ref_name }}" > commit.txt
          git init -q && git checkout -q -b comparacion-ci
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "comparacion ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" comparacion-ci
