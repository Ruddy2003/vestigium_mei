name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk "vestigium-mei-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vestigium-mei-apk
          path: vestigium-mei-*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" "vestigium-mei-${{ github.run_number }}.apk" \
            --title "Vestigium Mei · versión ${{ github.run_number }}" \
            --notes "Descarga el archivo .apk de abajo e instálalo encima de la versión anterior. Tus datos se conservan." \
            --latest
