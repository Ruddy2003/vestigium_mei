name: Compilar APK

on:
  push:
    branches: [main]
    # Cambios solo de documentación no compilan ni publican una versión nueva.
    paths-ignore: ['docs/**', 'CLAUDE.md', 'README.md']
  # Lanzado a mano desde una rama, solo compila: nunca publica un Release fuera de `main`.
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar el Release (solo cuenta en main)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write   # para borrar las copias viejas de la APK en Actions

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Guardar errores para revisión
        if: failure()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          grep -E "^e: |error:|What went wrong|Could not|> Could|FAILED|Unresolved|AAPT|resource .* not found|Manifest merger" "$GITHUB_WORKSPACE/build.log" | head -300 > errores.txt || true
          tail -200 "$GITHUB_WORKSPACE/build.log" > final.txt
          git init -q && git checkout -q -b ci-log
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "${{ github.sha }} run ${{ github.run_number }} ${{ github.ref_name }}" > commit.txt
          git add . && git commit -qm "log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk "vestigium-mei-${{ github.run_number }}.apk"

      # Cada APK pesa ~50 MB y el plan gratuito da 500 MB de almacenamiento de
      # Actions en repos privados. Se dejan solo las 4 copias más recientes (más
      # la de esta compilación); las de main quedan además en Releases, que no cuenta.
      - name: Borrar APKs viejas de Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.name == "vestigium-mei-apk" and .expired == false) | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +5 | cut -d' ' -f2 \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; done

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # si falla por espacio, el Release se publica igual
        with:
          name: vestigium-mei-apk
          path: vestigium-mei-*.apk
          retention-days: 7

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publicar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" "vestigium-mei-${{ github.run_number }}.apk" \
            --title "Vestigium Mei · versión ${{ github.run_number }}" \
            --notes "Descarga el archivo .apk de abajo e instálalo encima de la versión anterior. Tus datos se conservan." \
            --latest
