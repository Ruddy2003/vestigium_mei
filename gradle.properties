org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# El compilador de Kotlin con su propia memoria: los muebles de cada tema (ui/vida, lote E6) son mucho código de dibujo
# y con la heredada de Gradle se quedaba sin memoria al compilar. Con los cuadros de Abismo (S16) los 6 GB tampoco
# alcanzaron («GC overhead limit exceeded»), aunque a la máquina de CI le quedaban más de 7 GB libres: 8 GB.
kotlin.daemon.jvmargs=-Xmx8g -XX:+UseParallelGC
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
