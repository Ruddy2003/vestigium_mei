org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# El compilador de Kotlin con su propia memoria: los muebles de cada tema (ui/vida, lote E6) son mucho código de dibujo
# y con la heredada de Gradle se quedaba sin memoria al compilar.
kotlin.daemon.jvmargs=-Xmx6g -XX:+UseParallelGC
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
