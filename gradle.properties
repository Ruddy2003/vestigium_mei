org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# El compilador de Kotlin con su propia memoria: los muebles de cada tema (ui/vida, lote E6) son mucho código de dibujo
# y con la heredada de Gradle se quedaba sin memoria al compilar. Con los Idearios rehechos (nov 2026) 6 GB ya no bastaron
# («GC overhead limit exceeded» en la corrida 7 de comparación): sube a 9 GB y Gradle baja a 3 GB para caber en la máquina de CI.
kotlin.daemon.jvmargs=-Xmx9g -XX:+UseParallelGC
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
